[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilifetrack"
version = "0.5.4"
description = "Private macOS archive for Find My locations and local communications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.15"
dependencies = [
  "cryptography>=42,<47",
  "icloudpy==0.9.0",
  "keyring>=25,<26",
  "pytypedstream>=0.1,<0.2",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6,<7", "pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
ilifetrack = "ilifetrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "build", "viewer/.build"]
